<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ONE MAN</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- GOOGLE FONT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="UMER.png" sizes="96x96" />
    <link rel="apple-touch-icon" sizes="180x180" href="UMER.png" />
    <link rel="manifest" href="fav.png" />
  </head>

  <body>
    <!-- BACKGROUND LIGHTS -->
    <div class="light light1"></div>
    <div class="light light2"></div>
    <div class="light light3"></div>

    <!-- LOGIN BOX -->
    <div class="login-box" id="loginBox">
      <!-- LOGO -->
      <div class="logo">
        <img src="UMER.png" alt="Website Logo" draggable="false" />
      </div>

      <h2>UMER ALI KHAN</h2>

      <p class="subtitle">Ultra Premium Video Gallery</p>

      <!-- INPUTS -->
      <div class="input-box">
        <input
          type="text"
          id="username"
          placeholder="Enter Username"
          autocomplete="off"
        />
      </div>

      <div class="input-box">
        <input type="password" id="password" placeholder="Enter Password" />
      </div>

      <!-- BUTTON -->
      <button onclick="login()">LOGIN</button>
    </div>
<!-- GALLERY -->
<div id="gallery">
  <!-- HEADER -->
  <div class="gallery-header">
    <h1>WELCOME UMER</h1>

    <p class="gallery-text">Premium HD Video Collection</p>
  </div>

  <div class="video-grid">

    <!-- VIDEO 1 -->
    <div class="video-card">
      <video controls preload="metadata">
        <source src="sidumosewala1.mp4" type="video/mp4" />
      </video>

      <div class="video-title">Sidhu Moosewala Video 1</div>
    </div>

    <!-- VIDEO 2 -->
    <div class="video-card">
      <video controls preload="metadata">
        <source src="sidumosewala2.mp4" type="video/mp4" />
      </video>

      <div class="video-title">Sidhu Moosewala Video 2</div>
    </div>

    <!-- VIDEO 3 -->
    <div class="video-card">
      <video controls preload="metadata">
        <source src="sidumosewala3.mp4" type="video/mp4" />
      </video>

      <div class="video-title">Sidhu Moosewala Video 3</div>
    </div>
  </div>
</div>
    <!-- SCRIPT -->
    <script>
      // Hide gallery first
      document.getElementById("gallery").style.display = "none";

      // LOGIN FUNCTION
      function login() {
        var user = document.getElementById("username").value.trim();
        var pass = document.getElementById("password").value.trim();

        // LOGIN CHECK
        if (user === "UMER" && pass === "KHAN") {
          // HIDE LOGIN
          document.getElementById("loginBox").style.display = "none";

          // SHOW GALLERY
          document.getElementById("gallery").style.display = "block";

          // BODY ALIGN TOP AFTER LOGIN
          document.body.style.alignItems = "flex-start";

          document.body.style.paddingTop = "40px";
        } else {
          alert("INVALID LOGIN ❌");
        }
      }

      // ENTER BUTTON LOGIN
      document.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          login();
        }
      });
    </script>
  </body>
</html>
